<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <!-- Christmas Ruby 3D Bevel & Face Gradients -->
    <linearGradient id="rubyFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d42c30" />
      <stop offset="40%" stop-color="#A91619" />
      <stop offset="100%" stop-color="#680B10" />
    </linearGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3DE" />
      <stop offset="50%" stop-color="#D79A35" />
      <stop offset="100%" stop-color="#805010" />
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.5" flood-color="#032b1e" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Master 3D Embossed Wordmark Paths (Christmas Ruby & Antique Gold) -->
  <g filter="url(#dropShadow)">
    <!-- MetaForge text paths with exact 3D styling -->
    <g fill="url(#rubyFace)" stroke="url(#goldBevel)" stroke-width="2" stroke-linejoin="round" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="900" font-size="145">
      <text x="10" y="150" letter-spacing="-2">MetaForge</text>
    </g>
    <!-- Studio text sub-heading -->
    <g fill="#D79A35" stroke="#064A35" stroke-width="1" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="700" font-size="52">
      <text x="825" y="195" letter-spacing="1">Studio</text>
    </g>
  </g>

  <!-- High-Detail Botanical Pine Bough Embedded Cleanly via Base64 -->
  <!-- Rendered precisely at 155x32 layout scale next to Studio -->
  
</svg>