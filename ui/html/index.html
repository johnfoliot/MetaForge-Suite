<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaForge Studio</title>

    <link rel="stylesheet" href="/ui/css/layout.css?v={{ version_id }}">

    <link rel="stylesheet" id="mf-theme-stylesheet" href="/ui/css/default_theme.css?v={{ version_id }}">

    <link rel="stylesheet" href="/ui/css/help.css?v={{ version_id }}">
	
    <script src="/ui/js/metaforge_core.js?v={{ version_id }}"></script>
    
    <script src="/common/common_ui.js?v={{ version_id }}"></script>
</head>
<body>

<header role="banner">
    <nav class="global-nav" aria-label="Global Navigation">
        <img src="/ui/images/logo.svg?v={{ version_id }}" 
             id="mf-main-logo" 
             class="mf-logo" 
             alt="MetaForge Studio">

        {% for tool in tools %}
        <div class="nav-item" 
             id="mode-{{ tool.id }}" 
             role="button" 
             tabindex="0"
             aria-pressed="false" 
             onclick="switchMode('{{ tool.id }}')"
             onkeydown="if(event.key==='Enter' || event.key===' ') { event.preventDefault(); switchMode('{{ tool.id }}'); }"
             title="{{ tool.name }}">
            
            <div class="mf-icon-mask" 
                 style="-webkit-mask-image: url('/tool_asset/{{ tool.id }}/{{ tool.icon }}?v={{ version_id }}'); 
                        mask-image: url('/tool_asset/{{ tool.id }}/{{ tool.icon }}?v={{ version_id }}');
                        background-color: var(--mf-gold);">
            </div>
        </div>
        {% endfor %}
    </nav>
</header>
<main id="main-stage" role="main" aria-live="polite">
        <div id="mfi-content">
            <p class="tool_notes">Initializing MetaForge logic layers...</p>
        </div>
    </main>

    <!-- v2 shared Help dialog: the ONE help panel for every tool, opened by
         MFHelp.open() (metaforge_core.js) from each tool's header Help button.
         Native modal <dialog>: Esc / click outside close it, focus is held
         inside while open and returns to the Help button on close. -->
    <dialog id="mf-help-dialog" class="mf-help-dialog" aria-labelledby="mf-help-title" closedby="any">
        <div class="mf-help-head">
            <h2 id="mf-help-title">Help</h2>
            <form method="dialog"><button type="submit" class="mf-help-close" value="close" autofocus>Close</button></form>
        </div>
        <div class="mf-help-body" id="mf-help-body"></div>
    </dialog>

    <footer role="contentinfo" style="display: flex; justify-content: flex-end; padding: 0 15px;">
        <span class="data-text" style="font-size: 0.6rem; margin-bottom:3px;">
            Your library currently has <span style="color: var(--mf-gold); font-weight: bold;">{{ track_count }}</span> .mp3 files | &copy; 2026 MetaForge Studio 
        </span>
    </footer>

    <script>
    /**
     * LOCAL BRIDGE
     * Connects UI triggers to the mfSwitchMode engine in core.js
     */
    function switchMode(mode) {
        if (typeof window.mfSwitchMode === 'function') {
            window.mfSwitchMode(mode);
        } else {
            console.error("MetaForge Error: Global engine (mfSwitchMode) not registered.");
        }
    }
    </script>
</body>
</html>
