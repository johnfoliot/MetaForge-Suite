<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="900" height="540" rx="12" fill="#1a1a19"/>

  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Mood, Texture &amp; Flavor: Layering the Emotional Profile</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#c3c2b7">GEMS-inspired: a single Mood label isn't enough, so two more dimensions refine it</text>

  <!-- Card 1: Mood -->
  <rect x="40" y="110" width="250" height="170" rx="10" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
  <rect x="40" y="126" width="250" height="18" fill="#3987e5"/>
  <rect x="40" y="110" width="250" height="34" rx="10" fill="#3987e5"/>
  <text x="165" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MOOD · 6 options</text>
  <text x="165" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Melancholic</text>
  <text x="165" y="225" text-anchor="middle" font-size="12" fill="#c3c2b7">Placed by Russell's</text>
  <text x="165" y="242" text-anchor="middle" font-size="12" fill="#c3c2b7">valence / arousal plane</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="195" x2="320" y2="195" stroke="#898781" stroke-width="2"/>
  <polygon points="320,195 310,189 310,201" fill="#898781"/>
  <text x="305" y="180" text-anchor="middle" font-size="16" fill="#898781">+</text>

  <!-- Card 2: Sonic Texture -->
  <rect x="325" y="110" width="250" height="170" rx="10" fill="#1a1a19" stroke="#199e70" stroke-width="2"/>
  <rect x="325" y="126" width="250" height="18" fill="#199e70"/>
  <rect x="325" y="110" width="250" height="34" rx="10" fill="#199e70"/>
  <text x="450" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SONIC TEXTURE · 9 options</text>
  <text x="450" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Raw</text>
  <text x="450" y="225" text-anchor="middle" font-size="12" fill="#c3c2b7">How the track is</text>
  <text x="450" y="242" text-anchor="middle" font-size="12" fill="#c3c2b7">built and recorded</text>

  <!-- Arrow 2 -->
  <line x1="575" y1="195" x2="605" y2="195" stroke="#898781" stroke-width="2"/>
  <polygon points="605,195 595,189 595,201" fill="#898781"/>
  <text x="590" y="180" text-anchor="middle" font-size="16" fill="#898781">+</text>

  <!-- Card 3: Emotional Flavor -->
  <rect x="610" y="110" width="250" height="170" rx="10" fill="#1a1a19" stroke="#9085e9" stroke-width="2"/>
  <rect x="610" y="126" width="250" height="18" fill="#9085e9"/>
  <rect x="610" y="110" width="250" height="34" rx="10" fill="#9085e9"/>
  <text x="735" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">EMOTIONAL FLAVOR · 9 options</text>
  <text x="735" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Nostalgic</text>
  <text x="735" y="225" text-anchor="middle" font-size="12" fill="#c3c2b7">A finer emotional shade</text>
  <text x="735" y="242" text-anchor="middle" font-size="12" fill="#c3c2b7">layered on top of Mood</text>

  <!-- Down arrow to result -->
  <line x1="450" y1="290" x2="450" y2="330" stroke="#898781" stroke-width="2"/>
  <polygon points="450,330 444,320 456,320" fill="#898781"/>

  <!-- Result band -->
  <rect x="100" y="345" width="700" height="150" rx="10" fill="#242422" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="450" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#898781" letter-spacing="1">ONE SPECIFIC EMOTIONAL FINGERPRINT</text>
  <text x="450" y="418" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">"Melancholic, Raw, Nostalgic" — Intensity 4/10</text>
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#c3c2b7">Distinct from a "Melancholic, Orchestral, Atmospheric" track at the same Mood —</text>
  <text x="450" y="470" text-anchor="middle" font-size="13" fill="#c3c2b7">6 × 9 × 9 × 10 = 4,860 possible acoustic profiles, before Genre is even considered</text>
</svg>
